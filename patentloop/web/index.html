<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatentLoop</title>
<style>
  :root {
    --bg: #05070f;
    --panel: rgba(13, 20, 38, 0.85);
    --line: rgba(0, 229, 255, 0.18);
    --cyan: #00e5ff;
    --magenta: #ff2ec4;
    --green: #2bffab;
    --red: #ff4d6d;
    --amber: #ffc44d;
    --purple: #b48cff;
    --text: #cfe6ff;
    --dim: #5d7ba0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 70% -10%, rgba(0,229,255,.08), transparent),
      radial-gradient(900px 500px at 10% 110%, rgba(255,46,196,.07), transparent),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.012) 2px 4px);
  }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 32px 20px 60px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
  h1 {
    font-family: "Consolas", "SFMono-Regular", monospace;
    font-size: 30px; letter-spacing: 4px; color: var(--cyan);
    text-shadow: 0 0 18px rgba(0,229,255,.55);
  }
  h1 .loop { color: var(--magenta); text-shadow: 0 0 18px rgba(255,46,196,.55); }
  header small { color: var(--dim); letter-spacing: 2px; text-transform: uppercase; font-size: 11px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; margin-top: 18px; backdrop-filter: blur(6px);
    box-shadow: 0 0 30px rgba(0,229,255,.05) inset;
  }
  .panel h2 {
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim);
    margin-bottom: 12px;
  }
  textarea {
    width: 100%; min-height: 96px; resize: vertical;
    background: rgba(3,6,14,.9); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font: 14px/1.5 "Consolas", monospace; outline: none;
  }
  textarea:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.25); }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  button {
    background: linear-gradient(135deg, rgba(0,229,255,.15), rgba(255,46,196,.15));
    color: var(--cyan); border: 1px solid var(--cyan); border-radius: 8px;
    padding: 10px 26px; font: 700 14px "Consolas", monospace; letter-spacing: 2px;
    cursor: pointer; text-transform: uppercase; transition: all .2s;
  }
  button:hover:not(:disabled) { box-shadow: 0 0 20px rgba(0,229,255,.45); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .agents { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .agent {
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px; text-align: center;
    font: 11px "Consolas", monospace; letter-spacing: 1px; color: var(--dim);
    text-transform: uppercase; transition: all .3s; position: relative;
  }
  .agent.active {
    color: var(--cyan); border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0,229,255,.35); animation: pulse 1.2s infinite;
  }
  .agent.done { color: var(--green); border-color: rgba(43,255,171,.4); }
  @keyframes pulse { 50% { box-shadow: 0 0 26px rgba(0,229,255,.6); } }

  /* ---- structured timeline ---- */
  #timeline { max-height: 640px; overflow-y: auto; }
  .placeholder { font: 12.5px "Consolas", monospace; color: var(--dim); }
  .iteration { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .iteration-head {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    font: 700 12px "Consolas", monospace; letter-spacing: 2px; color: var(--cyan);
    text-transform: uppercase; margin-bottom: 4px;
  }
  .iteration-idea { font-size: 13px; color: var(--text); line-height: 1.5; margin-bottom: 10px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .card {
    border: 1px solid var(--line); border-left: 3px solid var(--dim); border-radius: 8px;
    padding: 10px 12px; background: rgba(3,6,14,.55);
  }
  .card.research { border-left-color: var(--cyan); }
  .card.patents { border-left-color: var(--magenta); }
  .card.coverage { border-left-color: var(--amber); }
  .card.gate { border-left-color: var(--amber); }
  .card.pivot { border-left-color: var(--purple); }
  .card.draft { border-left-color: var(--green); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-title {
    font: 700 11px "Consolas", monospace; letter-spacing: 2px; text-transform: uppercase;
  }
  .card.research .card-title { color: var(--cyan); }
  .card.patents .card-title { color: var(--magenta); }
  .card.coverage .card-title, .card.gate .card-title { color: var(--amber); }
  .card.pivot .card-title { color: var(--purple); }
  .card.draft .card-title { color: var(--green); }
  .badge {
    font: 700 10px "Consolas", monospace; letter-spacing: 1px; border-radius: 20px;
    padding: 3px 10px; border: 1px solid var(--line); color: var(--dim); text-transform: uppercase;
  }
  .badge.running { color: var(--cyan); border-color: var(--cyan); animation: pulse 1.2s infinite; }
  .badge.pass, .badge.done { color: var(--green); border-color: rgba(43,255,171,.5); }
  .badge.fail { color: var(--red); border-color: rgba(255,77,109,.5); }
  .metrics { display: flex; gap: 18px; margin-top: 8px; flex-wrap: wrap; }
  .metric { font: 11px "Consolas", monospace; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .metric b { display: block; font-size: 20px; letter-spacing: 0; color: var(--text); }
  .card ul { list-style: none; margin-top: 8px; }
  .card li { font: 12px/1.7 "Consolas", monospace; color: var(--text); }
  .card li a { color: inherit; text-decoration: none; border-bottom: 1px dotted var(--dim); }
  .card li .sub { color: var(--dim); }
  .chip {
    display: inline-block; font: 10px "Consolas", monospace; border: 1px solid var(--line);
    border-radius: 20px; padding: 1px 8px; margin: 1px 2px; color: var(--dim);
  }
  .reason { font-size: 12.5px; line-height: 1.6; color: var(--text); margin-top: 8px; }

  /* coverage matrix table */
  .matrix-scroll { overflow-x: auto; margin-top: 8px; }
  table.matrix { border-collapse: collapse; font: 11px "Consolas", monospace; }
  table.matrix th, table.matrix td {
    border: 1px solid var(--line); padding: 5px 8px; text-align: center; white-space: nowrap;
  }
  table.matrix th { color: var(--dim); font-weight: 400; }
  table.matrix th a { color: var(--cyan); text-decoration: none; }
  table.matrix td.el { text-align: left; color: var(--text); max-width: 320px; white-space: normal; }
  table.matrix td.el .eid { color: var(--cyan); font-weight: 700; margin-right: 6px; }
  table.matrix td.hit { color: var(--red); background: rgba(255,77,109,.12); cursor: help; }
  table.matrix td.miss { color: rgba(93,123,160,.5); }
  table.matrix td.free { color: var(--green); background: rgba(43,255,171,.10); font-weight: 700; }
  tr.uncovered-row td.el .eid { color: var(--green); }
  .matrix-note { font: 11px "Consolas", monospace; color: var(--dim); margin-top: 6px; line-height: 1.6; }
  .matrix-note .open { color: var(--green); }

  .verdict { font: 700 22px "Consolas", monospace; letter-spacing: 3px; }
  .verdict.DRAFTED { color: var(--green); text-shadow: 0 0 16px rgba(43,255,171,.6); }
  .verdict.KILLED_SATURATED, .verdict.KILLED_INFEASIBLE {
    color: var(--red); text-shadow: 0 0 16px rgba(255,77,109,.6);
  }
  #summary { margin-top: 10px; font-size: 14px; line-height: 1.6; }
  .links { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .links a {
    color: var(--cyan); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 14px; text-decoration: none; font: 12px "Consolas", monospace;
  }
  .links a:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.3); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PATENT<span class="loop">LOOP</span></h1>
    <small>autonomous prior-art verification loop</small>
  </header>

  <section class="panel">
    <h2>Idea input</h2>
    <textarea id="idea" placeholder="Describe your invention idea in plain text..."></textarea>
    <div class="row">
      <button id="go">Initiate loop</button>
      <span id="status" style="font:12px 'Consolas',monospace;color:var(--dim)"></span>
    </div>
  </section>

  <section class="panel">
    <h2>Agent pipeline</h2>
    <div class="agents">
      <div class="agent" id="ag-research">Research</div>
      <div class="agent" id="ag-patents">Patent search</div>
      <div class="agent" id="ag-gate">Feasibility</div>
      <div class="agent" id="ag-pivot">Expert pivot</div>
      <div class="agent" id="ag-draft">Drafting</div>
    </div>
  </section>

  <section class="panel">
    <h2>Mission timeline</h2>
    <div id="timeline"><div class="placeholder">// awaiting input</div></div>
  </section>

  <section class="panel hidden" id="result">
    <h2>Verdict</h2>
    <div class="verdict" id="verdict"></div>
    <div id="summary"></div>
    <div class="links" id="links"></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const agents = { research: 'ag-research', patents: 'ag-patents', gate: 'ag-gate', pivot: 'ag-pivot', draft: 'ag-draft' };

function setAgent(key, state) {
  const el = $(agents[key]);
  el.classList.remove('active', 'done');
  if (state) el.classList.add(state);
}
function resetAgents() { Object.keys(agents).forEach(k => setAgent(k, null)); }

/* ---- structured timeline rendering ---- */
let currentIteration = null;

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function iterationBlock(number, idea) {
  const block = el('div', 'iteration');
  const head = el('div', 'iteration-head');
  head.appendChild(el('span', '', `Iteration ${number}`));
  block.appendChild(head);
  block.appendChild(el('div', 'iteration-idea', idea));
  const cards = el('div', 'cards');
  block.appendChild(cards);
  const timeline = $('timeline');
  timeline.appendChild(block);
  timeline.scrollTop = timeline.scrollHeight;
  return { block, cards };
}

function card(kind, title) {
  const box = el('div', `card ${kind}`);
  const head = el('div', 'card-head');
  head.appendChild(el('span', 'card-title', title));
  const badge = el('span', 'badge running', 'running');
  head.appendChild(badge);
  box.appendChild(head);
  currentIteration.cards.appendChild(box);
  const timeline = $('timeline');
  timeline.scrollTop = timeline.scrollHeight;
  return { box, badge };
}

function setBadge(badge, cls, text) {
  badge.className = `badge ${cls}`;
  badge.textContent = text;
}

function metrics(box, entries) {
  const wrap = el('div', 'metrics');
  for (const [label, value] of entries) {
    const m = el('div', 'metric', label);
    m.prepend(el('b', '', String(value)));
    wrap.appendChild(m);
  }
  box.appendChild(wrap);
}

function coverageTable(ev) {
  const { box, badge } = card('coverage', 'Coverage matrix — element × patent');
  setBadge(badge, ev.uncovered.length ? 'pass' : 'fail',
           ev.uncovered.length ? `${ev.uncovered.length} open` : 'all covered');
  const patents = ev.patents.slice(0, 8);
  const scroll = el('div', 'matrix-scroll');
  const table = el('table', 'matrix');
  const headRow = el('tr');
  headRow.appendChild(el('th', '', 'Element'));
  for (const p of patents) {
    const th = el('th');
    const a = el('a', '', p.patent_id || '?');
    if (p.url) { a.href = p.url; a.target = '_blank'; }
    a.title = p.title || '';
    th.appendChild(a);
    headRow.appendChild(th);
  }
  headRow.appendChild(el('th', '', 'Status'));
  table.appendChild(headRow);

  for (const element of ev.elements) {
    const open = ev.uncovered.includes(element.id);
    const row = el('tr', open ? 'uncovered-row' : '');
    const label = el('td', 'el');
    label.appendChild(el('span', 'eid', element.id));
    label.appendChild(document.createTextNode(element.text));
    row.appendChild(label);
    const cells = (ev.coverage || {})[element.id] || {};
    for (const p of patents) {
      const cell = cells[p.patent_id] || {};
      const td = el('td', cell.covered ? 'hit' : 'miss', cell.covered ? '✕' : '·');
      if (cell.covered && cell.evidence) td.title = `evidence: ${cell.evidence}`;
      row.appendChild(td);
    }
    row.appendChild(el('td', open ? 'free' : 'miss', open ? 'OPEN' : 'covered'));
    table.appendChild(row);
  }
  scroll.appendChild(table);
  box.appendChild(scroll);
  const note = el('div', 'matrix-note');
  note.append('✕ = patent covers element (hover for evidence sentence) · ');
  const open = el('span', 'open',
    ev.uncovered.length
      ? `uncovered (potential novelty): ${ev.uncovered.join(', ')}`
      : 'no uncovered elements — every element collides with prior art');
  note.appendChild(open);
  box.appendChild(note);
}

let cards = {};

function memoryCard(ev) {
  const block = el('div', 'iteration');
  const head = el('div', 'iteration-head');
  head.appendChild(el('span', '', 'Cross-run memory'));
  block.appendChild(head);
  const box = el('div', 'card pivot');
  const cardHead = el('div', 'card-head');
  cardHead.appendChild(el('span', 'card-title', 'Recalled prior art from earlier runs'));
  const badge = el('span', 'badge done', `${ev.hits.length} recalled`);
  cardHead.appendChild(badge);
  box.appendChild(cardHead);
  const list = el('ul');
  ev.hits.forEach(h => {
    const li = el('li', '', `\u21b3 ${h.patent_id}  ${h.title} `);
    li.appendChild(el('span', 'chip', `sim ${h.similarity}`));
    li.appendChild(el('span', 'chip', `from run ${h.source_run_id}`));
    list.appendChild(li);
  });
  box.appendChild(list);
  block.appendChild(box);
  $('timeline').appendChild(block);
}

function handle(ev) {
  switch (ev.event) {
    case 'memory':
      memoryCard(ev);
      break;
    case 'extract':
      currentIteration = iterationBlock(ev.iteration, ev.idea);
      cards = {};
      if (ev.iteration === 1) resetAgents(); else { resetAgents(); }
      break;
    case 'extracted': {
      const { box, badge } = card('research', 'Element extraction');
      setBadge(badge, 'done', `${(ev.elements || []).length} elements`);
      const list = el('ul');
      (ev.elements || []).forEach((element, index) =>
        list.appendChild(el('li', '', `E${index + 1}  ${element}`)));
      box.appendChild(list);
      break;
    }
    case 'research':
      setAgent('research', 'active');
      cards.research = card('research', 'Research agent — Semantic Scholar · arXiv · GitHub');
      break;
    case 'research_done': {
      setAgent('research', 'done');
      const { box, badge } = cards.research;
      setBadge(badge, 'done', 'done');
      metrics(box, [['novelty score', ev.novelty_score], ['documents retrieved', ev.documents_considered]]);
      if ((ev.closest_prior_work || []).length) {
        const list = el('ul');
        ev.closest_prior_work.forEach(w => {
          const li = el('li');
          const a = el('a', '', w.title);
          if (w.url) { a.href = w.url; a.target = '_blank'; }
          li.append('↳ '); li.appendChild(a);
          list.appendChild(li);
        });
        box.appendChild(list);
      }
      break;
    }
    case 'patent_search':
      setAgent('patents', 'active');
      cards.patents = card('patents', 'Patent search agent — Google Patents (US/EP/WIPO)');
      break;
    case 'coverage':
      coverageTable(ev);
      break;
    case 'patent_search_done': {
      setAgent('patents', 'done');
      const { box, badge } = cards.patents;
      setBadge(badge, 'done', 'done');
      metrics(box, [['overlap score', ev.overlap_score], ['patents retrieved', ev.patents_considered]]);
      if ((ev.matched_patents || []).length) {
        const list = el('ul');
        ev.matched_patents.forEach(p => {
          const li = el('li', '', `↳ ${p.patent_id}  ${p.title} `);
          (p.overlapping_elements || []).forEach(o => li.appendChild(el('span', 'chip', o)));
          list.appendChild(li);
        });
        box.appendChild(list);
      }
      break;
    }
    case 'feasibility':
      setAgent('gate', 'active');
      cards.gate = card('gate', 'Feasibility gate — doable + scoped');
      break;
    case 'feasibility_done': {
      setAgent('gate', ev.passed ? 'done' : null);
      const { box, badge } = cards.gate;
      setBadge(badge, ev.passed ? 'pass' : 'fail', ev.passed ? 'pass' : 'fail');
      metrics(box, [['doable', ev.doable ? 'yes' : 'no'], ['scoped', ev.scoped ? 'yes' : 'no']]);
      break;
    }
    case 'pivot':
      setAgent('pivot', 'active');
      cards.pivot = card('pivot', `Expert pivot agent — ${ev.field} specialist`);
      break;
    case 'pivot_done': {
      setAgent('pivot', 'done');
      const { box, badge } = cards.pivot;
      setBadge(badge, 'done', ev.pivot_direction || 'pivoted');
      box.appendChild(el('div', 'reason', `→ ${ev.new_idea}`));
      break;
    }
    case 'drafting':
      setAgent('draft', 'active');
      cards.draft = card('draft', 'Drafting agent — provisional application');
      break;
    case 'done': {
      if (ev.status === 'DRAFTED') {
        setAgent('draft', 'done');
        if (cards.draft) setBadge(cards.draft.badge, 'done', 'drafted');
      }
      const { box, badge } = card(ev.status === 'DRAFTED' ? 'draft' : 'gate', 'Loop terminated');
      setBadge(badge, ev.status === 'DRAFTED' ? 'pass' : 'fail', ev.status);
      if (ev.kill_reason) box.appendChild(el('div', 'reason', ev.kill_reason));
      break;
    }
    case 'result': showResult(ev); break;
    case 'error': {
      const { box, badge } = currentIteration
        ? card('gate', 'Error')
        : (currentIteration = iterationBlock('—', ''), card('gate', 'Error'));
      setBadge(badge, 'fail', 'error');
      box.appendChild(el('div', 'reason', ev.detail || 'unknown error'));
      break;
    }
  }
}

function showResult(ev) {
  $('result').classList.remove('hidden');
  const v = $('verdict');
  v.textContent = ev.status;
  v.className = 'verdict ' + ev.status;
  const summaries = {
    DRAFTED: 'The idea survived every gate: novelty confirmed against live literature, no blocking claim overlap found at the USPTO, and the feasibility gate passed. A provisional patent application draft has been generated.',
    KILLED_SATURATED: 'The loop pivoted through variants but claim overlap with existing patents stayed high and the pivot space converged — the field is saturated.',
    KILLED_INFEASIBLE: 'The feasibility gate rejected the idea: it is either not technically doable or too broadly scoped to support a real patent claim.'
  };
  let text = summaries[ev.status] || '';
  if (ev.kill_reason) text += ' ' + ev.kill_reason;
  if (ev.lineage && ev.lineage.length > 1) {
    text += ` The idea evolved through ${ev.lineage.length} versions during the run.`;
  }
  $('summary').textContent = text;
  const links = $('links');
  links.innerHTML = '';
  const files = ['report.md', 'prior_art.json', 'trace.json'];
  if (ev.status === 'DRAFTED') files.push('draft_application.pdf');
  files.forEach(f => {
    const a = document.createElement('a');
    a.href = `/api/runs/${ev.run_id}/${f}`;
    a.textContent = f;
    a.target = '_blank';
    links.appendChild(a);
  });
}

$('go').addEventListener('click', async () => {
  const idea = $('idea').value.trim();
  if (!idea) return;
  $('go').disabled = true;
  $('status').textContent = 'loop running — fully autonomous, no further input needed';
  $('result').classList.add('hidden');
  $('timeline').innerHTML = '';
  currentIteration = null;
  cards = {};
  resetAgents();
  try {
    const response = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idea })
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try { const ev = JSON.parse(line); if (ev.event !== 'heartbeat') handle(ev); }
        catch (e) { /* partial line */ }
      }
    }
  } catch (err) {
    handle({ event: 'error', detail: err.message });
  } finally {
    $('go').disabled = false;
    $('status').textContent = '';
  }
});
</script>
</body>
</html>
